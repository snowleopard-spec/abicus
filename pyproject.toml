[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abicus"
version = "3.0.0"
description = "Local-only personal-finance dashboard unifying four sub-apps under one FastAPI server."
requires-python = ">=3.11"
readme = "README.md"

# Feature B's transformer guess engine (spec R7): sentence-transformers
# drags in torch (~2 GB installed), so it is an optional extra — the base
# app stays dependency-light and degrades to rapidfuzz-only guessing with
# an install hint. Enable with: pip install -e '.[suggest]'
[project.optional-dependencies]
suggest = [
    "sentence-transformers==5.7.0",
    "numpy==2.4.2",
]

[tool.setuptools.packages.find]
include = ["abicus*"]

[tool.setuptools.package-data]
"abicus" = [
    "shell/templates/*.html",
    "shell/static/css/*.css",
    "shell/static/js/*.js",
    "shell/static/img/*",
    "apps/*/templates/*.html",
    "apps/*/static/*",
]
