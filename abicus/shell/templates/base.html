<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Abicus{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/shell/static/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@900&family=Source+Sans+Pro:wght@300;400;600;700&display=swap">
  <link rel="stylesheet" href="/shell/static/css/tokens.css?v={{ asset_v }}">
  <link rel="stylesheet" href="/shell/static/css/shell.css?v={{ asset_v }}">
  <link rel="stylesheet" href="/shell/static/css/components.css?v={{ asset_v }}">
  {% block head %}{% endblock %}
</head>
<body data-active="{{ active }}">
  <div class="watermark" aria-hidden="true">Abicus</div>
  <header class="topbar">
    <nav class="pill-tabs app-tabs" aria-label="Apps">
      <a href="/outflows" class="pill-tab app-tab--outflows">Outflows</a>
      <a href="/assets" class="pill-tab app-tab--assets">Assets</a>
      <a href="/claims" class="pill-tab app-tab--claims">Claims</a>
      <a href="/mortgage" class="pill-tab app-tab--mortgage">Mortgage</a>
    </nav>
  </header>
  <main class="content">
    <header class="page-header">
      <div class="page-header__title">
        <div class="breadcrumb">{% block breadcrumb %}{% endblock %}</div>
        <h1>{% block page_title %}{% endblock %}</h1>
      </div>
      <div class="page-actions">
        {% block page_actions %}{% endblock %}
      </div>
    </header>
    <section class="page-body">
      {% block content %}{% endblock %}
    </section>
  </main>
  <div id="toasts" class="toasts"></div>
  <script src="/shell/static/js/api.js?v={{ asset_v }}"></script>
  <script src="/shell/static/js/shell.js?v={{ asset_v }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
